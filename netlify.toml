[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://checkout.flutterwave.com https://js.paystack.co https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://forgeestimateultrapro.onrender.com https://api.groq.com https://api.anthropic.com https://api.etherscan.io https://js.paystack.co https://api.paystack.co https://checkout.flutterwave.com https://data.mongodb-api.com https://*.supabase.co https://api.sakana.ai; img-src 'self' data: blob: https://*.gstatic.com; frame-src 'self' https://checkout.flutterwave.com https://checkout.paystack.com https://js.paystack.co;"

[build]
  command = "npm run build"
  publish = "dist"
